name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/xsltcraft-ui/package-lock.json'

      - name: Install dependencies
        working-directory: frontend/xsltcraft-ui
        run: npm ci

      - name: Lint
        working-directory: frontend/xsltcraft-ui
        run: npm run lint --if-present

      - name: Build
        working-directory: frontend/xsltcraft-ui
        run: npm run build

      - name: Test
        working-directory: frontend/xsltcraft-ui
        run: npm run test --if-present

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./frontend/xsltcraft-ui/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  backend:
    runs-on: ubuntu-latest
    env:
      # IKVM jar→.NET dönüşüm önbelleği (IKVM.MSBuild varsayılanı GetTempPath()/ikvm/cache/1/; sabitlenir).
      IkvmCacheDir: /tmp/ikvm/cache/1/
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: xsltcraft_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj', 'backend/**/packages.lock.json', 'backend/build/*.targets') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache Maven + IKVM (Saxon-HE)
        uses: actions/cache@v4
        with:
          # Jar'lar her build'de maven-hashes.txt'e karşı SHA-256 ile doğrulanır (MavenHashVerification).
          path: |
            ~/.m2/repository
            /tmp/ikvm/cache
          key: ${{ runner.os }}-maven-ikvm-${{ hashFiles('backend/XsltCraft.Xslt.Saxon/XsltCraft.Xslt.Saxon.csproj', 'backend/XsltCraft.Xslt.Saxon/maven-hashes.txt', 'backend/XsltCraft.Xslt.Saxon/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-maven-ikvm-

      - name: Restore
        working-directory: backend
        # --locked-mode: packages.lock.json olan projeler (Xslt.Saxon) kilitten sapamaz (ADR 008 §9).
        run: dotnet restore --locked-mode

      - name: Format check
        working-directory: backend
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost;Port=5432;Database=xsltcraft_test;User Id=postgres;Password=postgres;"
        # Hariç: Eval (aşağıda non-blocking), Measurement, Corpus. WorkerIntegration DAHİL (bloke eder).
        run: dotnet test --no-build --configuration Release --filter "Category!=Eval&Category!=Measurement&Category!=Corpus" --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-backend
          path: '**/test-results.trx'

  # ECC eval harness — non-blocking. Bir regresyonu uyarı olarak raporlar ama PR'ı
  # bloklamaz (continue-on-error). Olgunlaşınca continue-on-error kaldırılıp blocking'e geçilir.
  eval:
    runs-on: ubuntu-latest
    env:
      # IKVM jar→.NET dönüşüm önbelleği (IKVM.MSBuild varsayılanı GetTempPath()/ikvm/cache/1/; sabitlenir).
      IkvmCacheDir: /tmp/ikvm/cache/1/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/**/*.csproj', 'backend/**/packages.lock.json', 'backend/build/*.targets') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache Maven + IKVM (Saxon-HE)
        uses: actions/cache@v4
        with:
          # Jar'lar her build'de maven-hashes.txt'e karşı SHA-256 ile doğrulanır (MavenHashVerification).
          path: |
            ~/.m2/repository
            /tmp/ikvm/cache
          key: ${{ runner.os }}-maven-ikvm-${{ hashFiles('backend/XsltCraft.Xslt.Saxon/XsltCraft.Xslt.Saxon.csproj', 'backend/XsltCraft.Xslt.Saxon/maven-hashes.txt', 'backend/XsltCraft.Xslt.Saxon/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-maven-ikvm-

      - name: Restore
        working-directory: backend
        # --locked-mode: packages.lock.json olan projeler (Xslt.Saxon) kilitten sapamaz (ADR 008 §9).
        run: dotnet restore --locked-mode

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      - name: Run XSLT eval cases (non-blocking)
        id: eval
        continue-on-error: true
        working-directory: backend
        env:
          DiffEngine_Disabled: 'true'
        run: dotnet test --no-build --configuration Release --filter "Category=Eval" --logger "trx;LogFileName=eval-results.trx"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: '**/eval-results.trx'

      - name: Warn on eval regression
        if: steps.eval.outcome == 'failure'
        run: echo "::warning title=ECC eval regression::XSLT eval case'lerinden biri başarısız (non-blocking). Eval artefaktını incele."

  validate-version:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CHANGELOG consistency
        run: |
          # Verify CHANGELOG.md has an [Unreleased] section
          if ! grep -q "^## \[Unreleased\]" CHANGELOG.md; then
            echo "❌ CHANGELOG.md missing [Unreleased] section"
            exit 1
          fi
          echo "✅ CHANGELOG.md structure valid"

  status:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: always()
    steps:
      - name: Determine status
        run: |
          if [ "${{ needs.frontend.result }}" = "success" ] && [ "${{ needs.backend.result }}" = "success" ]; then
            echo "✅ All checks passed"
            exit 0
          else
            echo "❌ Some checks failed"
            exit 1
          fi
