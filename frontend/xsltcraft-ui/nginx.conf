server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # SPA girişi her zaman yeniden doğrulanır: yeni sürümde eski bundle (ör. kimliksiz önizleme çağrısı → 401)
    # tarayıcı önbelleğinden çalışmasın. try_files fallback'i de buraya iç yönlendirme yapar → aynı başlık.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash'li statik varlıklar (Vite) değişmez.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
